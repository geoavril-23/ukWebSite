<nav>
  <a class="nav-logo" href="{% url 'home' %}">
    <div class="nav-logo-mark">AK</div>
    <div>
      <div class="nav-logo-text">AAPSE-UK</div>
      <div class="nav-logo-sub">Université de Kara</div>
    </div>
  </a>
  <ul class="nav-links">
    <li><a href="{% url 'about' %}">À propos</a></li>
    <li><a href="{% url 'actualites' %}">Actualités</a></li>
    <li><a href="{% url 'members' %}">Membres</a></li>
    <li><a href="{% url 'ressources' %}">Ressources</a></li>
    <li><a href="{% url 'contact' %}" class="nav-cta">Rejoindre</a></li>
    {% if user.is_authenticated %}
      {% if user.is_superuser or user.profile.role == 'manager' %}
        <li><a href="{% url 'admin_dashboard' %}" title="Dashboard Admin"><i class="fas fa-tachometer-alt fa-lg"></i></a></li>
      {% else %}
        <li><a href="{% url 'user_dashboard' %}" title="Mon Espace"><i class="fas fa-tachometer-alt fa-lg"></i></a></li>
      {% endif %}
      <li><a href="{% url 'user_logout' %}" title="Se déconnecter" style="color: #e74a3b;"><i class="fas fa-sign-out-alt fa-lg"></i></a></li>
    {% else %}
      <li><a href="{% url 'login' %}" title="Se connecter"><i class="fas fa-user-circle fa-lg"></i></a></li>
    {% endif %}
  </ul>
  <button class="nav-burger" id="navBurger" aria-label="Ouvrir le menu">&#9776;</button>
</nav>

<style>
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(27,77,46,0.97);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(200,150,12,0.3);
    padding: 0 5%;
    display: flex; align-items: center; justify-content: space-between;
    height: 68px;
    transition: all .3s ease;
  }
  .nav-logo {
    display: flex; align-items: center; gap: 14px; text-decoration: none;
  }
  .nav-logo-mark {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-bright) 100%);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif;
    font-weight: 700; font-size: 15px;
    color: var(--forest-deep);
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }
  .nav-logo-text {
    font-family: 'Playfair Display', serif;
    font-weight: 600; font-size: 16px;
    color: var(--white);
    line-height: 1.2;
  }
  .nav-logo-sub {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 10px; font-weight: 400;
    color: var(--gold-pale);
    letter-spacing: 1.5px; text-transform: uppercase;
  }
  .nav-links {
    display: flex; align-items: center; gap: 6px;
    list-style: none;
  }
  .nav-links a {
    color: rgba(255,255,255,0.82);
    text-decoration: none;
    font-size: 13px; font-weight: 500;
    letter-spacing: 0.3px;
    padding: 6px 14px; border-radius: 3px;
    transition: all .2s;
  }
  .nav-links a:hover { color: var(--gold-bright); background: rgba(200,150,12,0.1); }
  .nav-cta {
    background: var(--gold) !important;
    color: var(--forest-deep) !important;
    font-weight: 600 !important;
    padding: 7px 18px !important;
    border-radius: 3px !important;
  }
  .nav-cta:hover { background: var(--gold-bright) !important; }
  .nav-burger {
    display: none;
    background: none; border: none; cursor: pointer;
    color: var(--white); font-size: 22px;
  }
  @media (max-width: 900px) {
    .nav-burger { display: block; }
    .nav-links {
      display: none;
      position: absolute; top: 68px; left: 0; right: 0;
      background: rgba(15,48,32,0.98);
      flex-direction: column;
      padding: 16px 5%; gap: 4px;
    }
    .nav-links.open { display: flex; }
    .nav-links li { width: 100%; }
    .nav-links a { display: block; width: 100%; padding: 10px 16px; }
  }
</style>
<script>
  document.getElementById('navBurger').addEventListener('click', function() {
    document.querySelector('.nav-links').classList.toggle('open');
  });
</script>
